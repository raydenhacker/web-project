<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone QR Generator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
      --qr-bg: #f8fafc;
      --qr-border: #e2e8f0;
      --input-bg: #ffffff;
      --theme-btn-bg: #ffffff;
      --theme-btn-border: #cbd5e1;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #475569;
      --qr-bg: #0f172a;
      --qr-border: #334155;
      --input-bg: #0f172a;
      --theme-btn-bg: #1e293b;
      --theme-btn-border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      background: var(--bg-color);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      position: relative;
    }

    /* Tombol Switch Tema di Luar Form (Pojok Kanan Atas) */
    .theme-toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--theme-btn-bg);
      border: 1px solid var(--theme-btn-border);
      color: var(--text-color);
      padding: 10px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .theme-toggle-btn:active {
      transform: scale(0.95);
    }

    /* Card Utama */
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-bottom: 20px;
      color: var(--text-color);
      font-size: 1.25rem;
    }

    /* Container QR Code */
    #qrcode {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      background: var(--qr-bg);
      border-radius: 12px;
      border: 2px dashed var(--qr-border);
      padding: 10px;
    }

    #qrcode img {
      margin: 0 auto;
    }
    
    /* Layout Input dengan Tombol Stepper */
    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-step {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      width: 48px;
      height: 48px;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .btn-step:active {
      background-color: #1d4ed8;
      transform: scale(0.95);
    }
    
    /* Input Text */
    input[type="text"].num-input {
      flex: 1;
      height: 48px;
      padding: 0 12px;
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }

    input[type="text"].num-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
  </style>
  <!-- Pustaka QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Tombol Tema Luar Form -->
  <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">
    <span id="themeIcon">🌙</span>
  </button>

  <div class="card">
    <h2>QR Generator by Fatikhul</h2>
    
    <!-- QR Code Tampil di Atas -->
    <div id="qrcode"></div>

    <!-- Group Input & Tombol -1 / +1 -->
    <div class="input-group">
      
      <input 
        type="text" 
        id="numberInput" 
        class="num-input"
        placeholder="Masukkan nomor..." 
        inputmode="numeric"
        oninput="handleInput(this)"
      />
<button class="btn-step" onclick="adjustValue(-1)">-1</button>
      <button class="btn-step" onclick="adjustValue(1)">+1</button>
    </div>
  </div>

  <script>
    let qrcode = null;

    // --- MANAJEMEN TEMA (DARK/LIGHT) ---
    function initTheme() {
      const savedTheme = localStorage.getItem('app-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButtonUI(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('app-theme', newTheme);
      updateThemeButtonUI(newTheme);
    }

    function updateThemeButtonUI(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
      } else {
        icon.textContent = '🌙';
      }
    }

    // Jalankan inisialisasi tema saat pertama kali load
    initTheme();

    // --- MANAJEMEN QR CODE & INPUT ---
    function updateQR(text) {
      const container = document.getElementById("qrcode");
      container.innerHTML = ""; 

      if (text.trim() !== "") {
        qrcode = new QRCode(container, {
          text: text,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }

    function handleInput(element) {
      element.value = element.value.replace(/[^0-9]/g, '');
      updateQR(element.value);
    }

    function adjustValue(delta) {
      const input = document.getElementById("numberInput");
      let valStr = input.value.trim();

      if (valStr === "") return;

      const leadingZerosMatch = valStr.match(/^0+/);
      const leadingZeros = leadingZerosMatch ? leadingZerosMatch[0] : "";
      
      if (leadingZeros.length === valStr.length) {
        if (delta > 0) {
          valStr = leadingZeros.substring(0, leadingZeros.length - 1) + "1";
        } else {
          return;
        }
      } else {
        let num = BigInt(valStr);
        let newNum = num + BigInt(delta);

        if (newNum < 0n) return;

        let newNumStr = newNum.toString();

        if (leadingZeros.length > 0) {
          const targetLength = valStr.length;
          valStr = newNumStr.padStart(targetLength, '0');
        } else {
          valStr = newNumStr;
        }
      }

      input.value = valStr;
      updateQR(valStr);
    }

    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log("Service Worker terdaftar."))
          .catch(err => console.log("Gagal mendaftarkan Service Worker:", err));
      });
    }
  </script>
</body>
</html>
